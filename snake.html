<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SNAKE (1980 Retro Edition)</title>
    <style>
        body {
            background-color: #050505;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            text-shadow: 0 0 8px #00FF00;
        }

        #game-board {
            border: 4px solid #00FF00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            background-color: #000000;
        }

        .ui-container {
            width: 400px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 5px #00FF00;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #00AA00;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    
    <div class="ui-container">
        <div>SCORE: <span id="score">0000</span></div>
        <div>RECORD: <span id="high-score">0000</span></div>
    </div>

    <canvas id="game-board" width="400" height="400"></canvas>

    <div class="instructions">
        [Flèches directionnelles] pour tourner<br>
        [Espace] pour Recommencer
    </div>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");

        // Configuration de la grille
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20 cases

        // Variables de jeu
        let snake = [];
        let dx = GRID_SIZE; // Vitesse X
        let dy = 0;         // Vitesse Y
        let foodX = 0;
        let foodY = 0;
        let score = 0;
        let highScore = 0;
        let gameOver = false;
        let gameInterval = null;
        let changingDirection = false; // Empêche le demi-tour instantané

        function initGame() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE,  y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE,  y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            gameOver = false;
            updateScore();
            generateFood();
            
            if (gameInterval) clearInterval(gameInterval);
            // Vitesse fixe rétro : 100 ms par frame (~10 images par seconde)
            gameInterval = setInterval(gameLoop, 100); 
        }

        function gameLoop() {
            if (gameOver) return;

            changingDirection = false;
            clearCanvas();
            moveSnake();
            checkCollision();
            
            if (!gameOver) {
                drawFood();
                drawSnake();
            } else {
                drawGameOver();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#00FF00";
            snake.forEach((part, index) => {
                // Style rétro : petits espaces de 1px entre les blocs
                ctx.fillRect(part.x + 1, part.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Mange la nourriture
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop(); // Retire la queue
            }
        }

        function generateFood() {
            foodX = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            foodY = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

            // Vérifie que la nourriture n'apparaît pas sur le serpent
            snake.forEach(part => {
                if (part.x === foodX && part.y === foodY) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#00FF00";
            // Un bloc clignotant ou fixe pour la nourriture
            ctx.fillRect(foodX + 3, foodY + 3, GRID_SIZE - 6, GRID_SIZE - 6);
        }

        function checkCollision() {
            const head = snake[0];

            // Collision avec les murs
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
            }

            // Collision avec soi-même
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = String(highScore).padStart(4, '0');
            }
            drawGameOver();
        }

        function drawGameOver() {
            clearCanvas();
            ctx.fillStyle = "#00FF00";
            ctx.font = "24px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.font = "14px 'Courier New', monospace";
            ctx.fillText("Appuyez sur ESPACE", canvas.width / 2, canvas.height / 2 + 20);
        }

        function updateScore() {
            scoreEl.textContent = String(score).padStart(4, '0');
        }

        // Gestion des contrôles claviers
        window.addEventListener("keydown", e => {
            if (e.code === "Space") {
                if (gameOver || !gameInterval) {
                    initGame();
                }
                return;
            }

            if (changingDirection) return;

            const keyPressed = e.key;
            const goingUp = dy === -GRID_SIZE;
            const goingDown = dy === GRID_SIZE;
            const goingRight = dx === GRID_SIZE;
            const goingLeft = dx === -GRID_SIZE;

            if ((keyPressed === "ArrowLeft" || keyPressed === "q" || keyPressed === "Q") && !goingRight) {
                dx = -GRID_SIZE;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === "ArrowUp" || keyPressed === "z" || keyPressed === "Z") && !goingDown) {
                dx = 0;
                dy = -GRID_SIZE;
                changingDirection = true;
            }
            if ((keyPressed === "ArrowRight" || keyPressed === "d" || keyPressed === "D") && !goingLeft) {
                dx = GRID_SIZE;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === "ArrowDown" || keyPressed === "s" || keyPressed === "S") && !goingUp) {
                dx = 0;
                dy = GRID_SIZE;
                changingDirection = true;
            }
        });

        // Démarrage initial
        initGame();
    </script>
</body>
</html>
