<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE (Mac & iOS)</title>
    <style>
        body {
            background-color: #050505;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        h1 { 
            margin: 5px 0; 
            letter-spacing: 6px; 
            text-shadow: 0 0 12px #00FF00; 
            font-size: 28px;
        }

        #game-board {
            border: 4px solid #00FF00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            background-color: #000000;
            max-width: 85vw;
            max-height: 50vh;
            width: 450px;
            height: 450px;
            touch-action: none; /* Bloque le scroll iOS pendant le jeu */
        }

        .ui-container {
            width: 85vw;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 8px #00FF00;
        }

        /* Pavé tactile pour iOS */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 8px;
            margin-top: 15px;
        }

        .btn {
            background: #000;
            border: 2px solid #00FF00;
            color: #00FF00;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { background: #00FF00; color: #000; }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }
        .restart { grid-column: 2; grid-row: 2; font-size: 10px; text-align: center; }

        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #00AA00;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SNAKE 1600px</h1>
    
    <div class="ui-container">
        <div>SCORE: <span id="score">0000</span></div>
        <div>RECORD: <span id="high-score">0000</span></div>
    </div>

    <!-- Zone de jeu 1600x1600 HD -->
    <canvas id="game-board" width="1600" height="1600"></canvas>

    <!-- Commandes tactiles iOS -->
    <div class="controls">
        <div class="btn up" onclick="handleInput('Up')">▲</div>
        <div class="btn left" onclick="handleInput('Left')">◄</div>
        <div class="btn restart" onclick="initGame()">START</div>
        <div class="btn right" onclick="handleInput('Right')">►</div>
        <div class="btn down" onclick="handleInput('Down')">▼</div>
    </div>

    <div class="instructions">
        Mac : [Flèches] + [Espace]<br>iOS : [Boutons] ou [Swipe sur le jeu]
    </div>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");

        const GRID_SIZE = 80;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let dx = GRID_SIZE, dy = 0;
        let foodX = 0, foodY = 0;
        let score = 0, highScore = 0;
        let gameOver = false, gameInterval = null;
        let changingDirection = false;

        function initGame() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE,  y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE,  y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            gameOver = false;
            updateScore();
            generateFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 90);
        }

        function gameLoop() {
            if (gameOver) return;

            changingDirection = false;
            clearCanvas();
            moveSnake();
            checkCollision();
            
            if (!gameOver) {
                drawFood();
                drawSnake();
            } else {
                drawGameOver();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#00FF00";
            snake.forEach(part => {
                ctx.fillRect(part.x + 4, part.y + 4, GRID_SIZE - 8, GRID_SIZE - 8);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === foodX && head.y === foodY) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            foodX = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            foodY = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

            snake.forEach(part => {
                if (part.x === foodX && part.y === foodY) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#00FF00";
            ctx.fillRect(foodX + 12, foodY + 12, GRID_SIZE - 24, GRID_SIZE - 24);
        }

        function checkCollision() {
            const head = snake[0];

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = String(highScore).padStart(4, '0');
            }
            drawGameOver();
        }

        function drawGameOver() {
            clearCanvas();
            ctx.fillStyle = "#00FF00";
            ctx.font = "bold 90px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "45px 'Courier New', monospace";
            ctx.fillText("[ESPACE] ou [START]", canvas.width / 2, canvas.height / 2 + 80);
        }

        function updateScore() {
            scoreEl.textContent = String(score).padStart(4, '0');
        }

        function handleInput(dir) {
            if (gameOver) {
                initGame();
                return;
            }
            if (changingDirection) return;

            const goingUp = dy === -GRID_SIZE;
            const goingDown = dy === GRID_SIZE;
            const goingRight = dx === GRID_SIZE;
            const goingLeft = dx === -GRID_SIZE;

            if (dir === "Left" && !goingRight) { dx = -GRID_SIZE; dy = 0; changingDirection = true; }
            if (dir === "Up" && !goingDown) { dx = 0; dy = -GRID_SIZE; changingDirection = true; }
            if (dir === "Right" && !goingLeft) { dx = GRID_SIZE; dy = 0; changingDirection = true; }
            if (dir === "Down" && !goingUp) { dx = 0; dy = GRID_SIZE; changingDirection = true; }
        }

        /* --- CONTROLES MAC (Clavier) --- */
        window.addEventListener("keydown", e => {
            if (e.code === "Space") {
                e.preventDefault();
                if (gameOver || !gameInterval) initGame();
                return;
            }

            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }

            if (e.code === "ArrowLeft") handleInput("Left");
            if (e.code === "ArrowUp") handleInput("Up");
            if (e.code === "ArrowRight") handleInput("Right");
            if (e.code === "ArrowDown") handleInput("Down");
        });

        /* --- CONTROLES iOS (Gestes Swipe) --- */
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            if (gameOver) initGame();
        }, { passive: true });

        canvas.addEventListener("touchend", e => {
            if (gameOver) return;
            
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 20) {
                    if (diffX > 0) handleInput("Right");
                    else handleInput("Left");
                }
            } else {
                if (Math.abs(diffY) > 20) {
                    if (diffY > 0) handleInput("Down");
                    else handleInput("Up");
                }
            }
        }, { passive: true });

        // Lancement
        initGame();
    </script>
</body>
</html>
