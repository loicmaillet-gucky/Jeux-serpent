<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE (Mac Edition)</title>
    <style>
        body {
            background-color: #050505;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 { 
            margin: 0 0 10px 0; 
            letter-spacing: 6px; 
            text-shadow: 0 0 12px #00FF00; 
            font-size: 32px;
        }

        #game-board {
            border: 4px solid #00FF00;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
            background-color: #000000;
            max-width: 90vw;
            max-height: 70vh;
            width: 500px;
            height: 500px;
        }

        .ui-container {
            width: 500px;
            max-width: 90vw;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 8px #00FF00;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #00AA00;
            text-align: center;
            line-height: 1.5;
        }

        .key {
            border: 1px solid #00FF00;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00FF00;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    
    <div class="ui-container">
        <div>SCORE: <span id="score">0000</span></div>
        <div>RECORD: <span id="high-score">0000</span></div>
    </div>

    <!-- Canvas Ultra HD 1600x1600 -->
    <canvas id="game-board" width="1600" height="1600"></canvas>

    <div class="instructions">
        Utilisez les <span class="key">Flèches</span> du Mac pour diriger<br>
        <span class="key">Espace</span> pour Démarrer / Recommencer
    </div>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");

        const GRID_SIZE = 80;
        const TILE_COUNT = canvas.width / GRID_SIZE; // Grille 20x20

        let snake = [];
        let dx = GRID_SIZE, dy = 0;
        let foodX = 0, foodY = 0;
        let score = 0, highScore = 0;
        let gameOver = false, gameInterval = null;
        let changingDirection = false;

        function initGame() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE,  y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE,  y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            gameOver = false;
            updateScore();
            generateFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 90);
        }

        function gameLoop() {
            if (gameOver) return;

            changingDirection = false;
            clearCanvas();
            moveSnake();
            checkCollision();
            
            if (!gameOver) {
                drawFood();
                drawSnake();
            } else {
                drawGameOver();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#00FF00";
            snake.forEach(part => {
                ctx.fillRect(part.x + 4, part.y + 4, GRID_SIZE - 8, GRID_SIZE - 8);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === foodX && head.y === foodY) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            foodX = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            foodY = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

            snake.forEach(part => {
                if (part.x === foodX && part.y === foodY) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#00FF00";
            ctx.fillRect(foodX + 12, foodY + 12, GRID_SIZE - 24, GRID_SIZE - 24);
        }

        function checkCollision() {
            const head = snake[0];

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = String(highScore).padStart(4, '0');
            }
            drawGameOver();
        }

        function drawGameOver() {
            clearCanvas();
            ctx.fillStyle = "#00FF00";
            ctx.font = "bold 90px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "50px 'Courier New', monospace";
            ctx.fillText("Appuyez sur ESPACE", canvas.width / 2, canvas.height / 2 + 80);
        }

        function updateScore() {
            scoreEl.textContent = String(score).padStart(4, '0');
        }

        /* --- GESTION EXCLUSIVE DES TOUCHES MAC --- */
        window.addEventListener("keydown", e => {
            // Relance avec ESPACE
            if (e.code === "Space") {
                e.preventDefault();
                if (gameOver || !gameInterval) initGame();
                return;
            }

            // Empêche le défilement de la page Safari/Chrome avec les flèches
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }

            if (changingDirection || gameOver) return;

            const goingUp = dy === -GRID_SIZE;
            const goingDown = dy === GRID_SIZE;
            const goingRight = dx === GRID_SIZE;
            const goingLeft = dx === -GRID_SIZE;

            // Contrôle strict par flèches directionnelles Mac
            if (e.code === "ArrowLeft" && !goingRight) {
                dx = -GRID_SIZE; dy = 0; changingDirection = true;
            }
            if (e.code === "ArrowUp" && !goingDown) {
                dx = 0; dy = -GRID_SIZE; changingDirection = true;
            }
            if (e.code === "ArrowRight" && !goingLeft) {
                dx = GRID_SIZE; dy = 0; changingDirection = true;
            }
            if (e.code === "ArrowDown" && !goingUp) {
                dx = 0; dy = GRID_SIZE; changingDirection = true;
            }
        });

        // Démarrage du jeu
        initGame();
    </script>
</body>
</html>
