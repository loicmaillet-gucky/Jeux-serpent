<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE (1980 Retro Edition)</title>
    <style>
        body {
            background-color: #050505;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }

        h1 { margin: 5px 0; letter-spacing: 4px; text-shadow: 0 0 8px #00FF00; }

        #game-board {
            border: 4px solid #00FF00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            background-color: #000000;
            max-width: 90vw;
            max-height: 90vw;
        }

        .ui-container {
            width: 300px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        /* D-Pad Tactile pour iOS */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            margin-top: 15px;
        }

        .btn {
            background: #000;
            border: 2px solid #00FF00;
            color: #00FF00;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
        }

        .btn:active { background: #00FF00; color: #000; }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }
        .restart { grid-column: 2; grid-row: 2; font-size: 12px; }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    
    <div class="ui-container">
        <div>SCORE: <span id="score">0000</span></div>
        <div>RECORD: <span id="high-score">0000</span></div>
    </div>

    <canvas id="game-board" width="300" height="300"></canvas>

    <div class="controls">
        <div class="btn up" onclick="setDir(0, -15)">▲</div>
        <div class="btn left" onclick="setDir(-15, 0)">◄</div>
        <div class="btn restart" onclick="initGame()">START</div>
        <div class="btn right" onclick="setDir(15, 0)">►</div>
        <div class="btn down" onclick="setDir(0, 15)">▼</div>
    </div>

    <script>
        const canvas = document.getElementById("game-board");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");

        const GRID_SIZE = 15;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let dx = GRID_SIZE, dy = 0;
        let foodX = 0, foodY = 0;
        let score = 0, highScore = 0;
        let gameOver = false, gameInterval = null;

        function initGame() {
            snake = [
                { x: 5 * GRID_SIZE, y: 5 * GRID_SIZE },
                { x: 4 * GRID_SIZE, y: 5 * GRID_SIZE }
            ];
            dx = GRID_SIZE; dy = 0; score = 0;
            gameOver = false;
            updateScore();
            generateFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function gameLoop() {
            if (gameOver) return;
            clearCanvas();
            moveSnake();
            checkCollision();
            if (!gameOver) { drawFood(); drawSnake(); } 
            else { drawGameOver(); }
        }

        function clearCanvas() { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height); }

        function drawSnake() {
            ctx.fillStyle = "#00FF00";
            snake.forEach(part => ctx.fillRect(part.x + 1, part.y + 1, GRID_SIZE - 2, GRID_SIZE - 2));
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            if (head.x === foodX && head.y === foodY) {
                score += 10; updateScore(); generateFood();
            } else { snake.pop(); }
        }

        function generateFood() {
            foodX = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            foodY = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
        }

        function drawFood() {
            ctx.fillStyle = "#00FF00";
            ctx.fillRect(foodX + 2, foodY + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        }

        function checkCollision() {
            const head = snake[0];
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) endGame();
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) endGame();
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);
            if (score > highScore) { highScore = score; highScoreEl.textContent = String(highScore).padStart(4, '0'); }
            drawGameOver();
        }

        function drawGameOver() {
            clearCanvas();
            ctx.fillStyle = "#00FF00";
            ctx.font = "18px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
        }

        function updateScore() { scoreEl.textContent = String(score).padStart(4, '0'); }

        function setDir(newDx, newDy) {
            if (gameOver) { initGame(); return; }
            if (newDx === -dx || newDy === -dy) return; // Empêche le demi-tour
            dx = newDx; dy = newDy;
        }

        initGame();
    </script>
</body>
</html>
